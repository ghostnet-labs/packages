# gpsd runs with "/dev/pps0 /dev/ttyUSB0" (40_cm5-gpsd-device). gpsd hands
# out SHM units in device order, so the GPIO PPS gets SHM(0) and the
# USB-UART NMEA gets SHM(1). Listing /dev/pps0 first keeps PPS on a fixed
# unit even if the CH340 enumerates after gpsd starts.

# SHM(0) is PPS signal
server 127.127.28.0 minpoll 4 maxpoll 4 prefer
fudge 127.127.28.0 refid PPS

# SHM(1) is GPS NMEA data. NMEA over USB is too jittery to select; it is
# kept visible in ntpq for calibrating time1.
server 127.127.28.1 minpoll 4 maxpoll 4 noselect
fudge 127.127.28.1 time1 0.000 refid GPS
