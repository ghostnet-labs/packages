# gpsd runs with "/dev/pps0 /dev/ttymxc0" (/etc/config/gpsd). gpsd hands out
# SHM units in device order, so the GPIO PPS gets SHM(0) and the GNSS UART's
# NMEA time gets SHM(1). gpsd stamps each PPS edge with the second from the
# NMEA stream, so SHM(0) is a complete time source on its own.

# SHM(0) is PPS signal
server 127.127.28.0 minpoll 4 maxpoll 4 prefer
fudge 127.127.28.0 refid PPS

# SHM(1) is GPS NMEA data. NMEA sentence timing is too jittery to select; it
# stays visible in ntpq for calibrating time1.
server 127.127.28.1 minpoll 4 maxpoll 4 noselect
fudge 127.127.28.1 time1 0.000 refid GPS
