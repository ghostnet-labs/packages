# gpsd runs with the single device /dev/ttyS1 (40_x86-gpsd-device). For a
# serial GNSS with PPS on DCD, gpsd gives the NMEA time SHM(0) and the PPS
# SHM(1), the same layout as bsp-venice.

# SHM(0) is GPS NMEA data. Kept selectable only as a fallback until time1
# is calibrated on the bench.
server 127.127.28.0 minpoll 4 maxpoll 4
fudge 127.127.28.0 time1 0.000 refid GPS

# SHM(1) is the DCD PPS signal
server 127.127.28.1 minpoll 4 maxpoll 4 prefer
fudge 127.127.28.1 refid PPS
