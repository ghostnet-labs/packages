name: Handle passing PRs
on:
  workflow_run:
    workflows: ["Manet merge gate","Build packages"]
    types: [completed]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited]
  pull_request_review:
    types: [submitted, dismissed]
  # Low-frequency fallback for dependencies and resolved conversations that
  # have no local CI event; check results and reviews above trigger it right
  # away, so this only catches what no event announces.
  schedule:
    - cron: '5 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: write
# A newer trigger replaces a queued or running sweep, so one run stuck waiting
# for a runner can never hold the group and starve every later run.
concurrency:
  group: manet-auto-merge
  cancel-in-progress: true
jobs:
  merge:
    name: Handle passing PRs
    # Same-repo and non-PR events use the self-hosted Linux ARM64 pool. Fork
    # PRs (pull_request_target) stay on hosted runners. This job only runs the
    # pinned policy script from the base repo and calls the API; it must never
    # check out or execute PR-head code.
    # Hosted on purpose: this job holds a write token, so it must not share a persistent
    # self-hosted runner with jobs that run PR code. Revisit with dedicated JIT runners.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ghostnet-labs/docs
          ref: 75f2913eb89745fc4ddc64d27248c7dba64c5393
          persist-credentials: false
      - name: Merge only eligible, protected PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 project/scripts/merge_policy.py merge --repo "$REPO"
