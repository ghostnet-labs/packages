name: Manet merge gate
on:
  pull_request:
    # closed: a new run in the same concurrency group cancels any gate still
    # waiting on a PR that was just merged or closed; the job itself is skipped.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited, closed]
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
concurrency:
  group: manet-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  gate:
    name: Manet merge gate
    # A closed run exists only to join the concurrency group above and cancel
    # the waiting gate; it has nothing to check, so it never takes a runner.
    if: github.event.action != 'closed'
    # Same-repo PRs use the Mac Studio runners; fork PRs stay on hosted
    # runners so outside code never executes on the self-hosted machine.
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-latest' }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ghostnet-labs/docs
          ref: 25793410cd24bca330c119ef2334a15c909d32ab
          persist-credentials: false
      - name: Verify merge policy regression suite
        run: python3 -m unittest discover -s project/tests -v
      - name: Wait for applicable current-head tests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 project/scripts/merge_policy.py gate --repo "$REPO" --pr "$PR" --sha "$SHA"
